<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="../image/favicon (1).ico"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile</title>
    <link rel="preload" as="image" href="../image/user.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="theme.css">

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
</head>
<body onload="loadProfileData()">
    <div class="theme-toggle" aria-label="Theme toggle">
        <button id="themeToggle" class="theme-toggle-button" type="button" title="Toggle dark mode">🌙</button>
    </div>
    <div class = "container">
        <!--back to userLoginand register html page-->
        <!-- User Profile Display Section -->
        <div class = "profile-section" id = "profile-section">
            <img class="back-button" src="../User/UserProfileImage/back-button.png" onclick="window.location.href= '../User/UserLoginAndRegister.html'; return false;" alt="Back Button" style="width: 40px; height: 40px; cursor: pointer; position: absolute; top: 20px; left: 20px;">
            <h1>Profile</h1>
            <div class="profile-picture">
                <button type="button" onclick="document.getElementById('profile-picture-input').click()" class="upload-button"><img id="profile-picture" src="../image/user.png" alt="Profile Picture" fetchpriority="high"></button>
                <input type="file" id="profile-picture-input" accept="image/*" style="display: none;" onchange="uploadProfilePicture(event)">       
            </div>
            <div class="profile-info">
                <p><span id="display-name"></span></p>
                <p><strong>Email:</strong> <span id="display-email"></span></p>
            </div>
        </div>  

        <!-- Edit Profile Section (Hidden by default) -->
        <div class="edit-profile-section" id="edit-profile-section" style="display: none;">
            <img class="back-button" src="../User/UserProfileImage/back-button.png" onclick="window.location.href= '../User/UserProfile.html'; return false;" alt="Back Button" style="width: 40px; height: 40px; cursor: pointer; position: absolute; top: 20px; left: 20px;">
            <h2>Edit Profile</h2>
            <form>
                <div class="floating-input">
                    <input type="text" id="profile-name" placeholder=" " required>
                    <label for="profile-name">Full Name</label>
                </div>
                <div class="floating-input">
                    <input type="text" id="profile-username" placeholder =" " required>
                    <label for="profile-username">Username</label>
                </div>
                <div class="floating-input">
                    <input type="tel" id="profile-phone" placeholder=" " required>
                    <label for="profile-phone">Phone Number</label>
                </div>
                <div class="floating-input">
                    <input type="text" id="profile-description" placeholder=" ">
                    <label for="profile-description">Description</label>
                </div>
                <div class="floating-input">
                    <input type="email" id="profile-email" placeholder=" " disabled>
                    <label for="profile-email">Email</label>
                </div>
                <button type="button" onclick="updateProfile()">Save Changes</button>
                <button type="button" onclick="cancelEdit()" class="cancel-btn">Cancel</button>
                <p id="profile-error" class="error"></p>
            </form>
        </div>

        <!-- change password section (hidden by default)-->
        <div class="change-password-section" id = "change-password-section" style="display: none;">
            <h2>Change Password</h2>
            <img class="back-button" src="../User/UserProfileImage/back-button.png" onclick="window.location.href= '../User/UserProfile.html'; return false;" alt="Back Button" style="width: 40px; height: 40px; cursor: pointer; position: absolute; top: 20px; left: 20px;">
            <form>
                <div class="floating-input">
                    <input type="password" id="current-password" placeholder=" " required>
                    <label for="current-password">Current Password</label>
                    <button type="button" onclick="togglePasswordVisibility('current-password')" style="position: absolute; right: 15px; top: 20%; transform: translateY(-50%); border: none; background: none; cursor: pointer;"><img id="current-password-icon" src="../image/eye.png" style="width: 20px; height: 20px;"></button>
                </div>
                <div class="floating-input">
                    <input type="password" id="new-password" placeholder=" " required>
                    <label for="new-password">New Password</label>
                    <button type="button" onclick="togglePasswordVisibility('new-password')" style="position: absolute; right: 15px; top: 20%; transform: translateY(-50%); border: none; background: none; cursor: pointer;"><img id="new-password-icon" src="../image/eye.png" style="width: 20px; height: 20px;"></button>
                </div>
                <button type="button" onclick="changeNewPassword()">Change Password</button>
                <button type="button" onclick="cancelChangePassword()" class="cancel-btn">Cancel</button>
                <p id="change-password-error" class="error"></p>
            </form>
        </div>

        <div class="notes-section" id="notes-section">
            <img class="back-button" src="../User/UserProfileImage/back-button.png" onclick="window.location.href= '../User/UserProfile.html'; return false;" alt="Back Button">
            <!-- notes header-->
            <h2>Your Notes</h2>
            <div class="notes-list" id="notes-container">
                <!-- Notes will appear here -->
            </div>
        </div>
            
        <!-- Profile Options -->
        <div class = "profile-options" id="profile-options">
            <button onclick="showEditProfile()"><img class="edit-profile-icon" src="../User/UserProfileImage/edit.png" alt="Edit Icon">Edit Profile</button>
            <button onclick="changePassword()"><img class="edit-profile-icon" src="../User/UserProfileImage/padlock.png">Change Password</button>
            <button onclick="window.location.href='../Appointment/ViewAppointment.html'"><img class="edit-profile-icon" src="../User/UserProfileImage/appointment.png">View Appointment</button>
            <button onclick="viewNotes()"><img class="edit-profile-icon" src="../User/UserProfileImage/notes.png">View Notes</button>
            <button onclick="requestLogout()"><img class="edit-profile-icon" src="../User/UserProfileImage/logout.png">Logout</button>
        </div>

        <div class="logout-confirmation-popup" id="logout-confirmation-popup">
            <div class="logout-confirmation-content">
                <h2>Confirm Logout</h2>
                <p>Are you sure you want to logout?</p>
                <button onclick="confirmLogout()">Logout</button>
                <button onclick="cancelLogout()" class="cancel-btn">Cancel</button>
            </div>
        </div>
    </div>

    <script src="../firebase-config.js"></script>
    <script src="app.js"></script>
    <script src="../Appointment/ViewAppointment.js"></script>
    <script src="../theme.js"></script>
</body>
</html>
