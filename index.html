<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .loading-container {
            text-align: center;
            color: white;
        }
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h2 {
            margin: 0;
            font-size: 1.5em;
        }
    </style>
    <link rel="stylesheet" href="theme.css">
</head>
<body>
    <div class="theme-toggle" aria-label="Theme toggle">
        <button id="themeToggle" class="theme-toggle-button" type="button" title="Toggle dark mode">🌙</button>
    </div>
    <div class="loading-container">
        <div class="spinner"></div>
        <h2>Loading...</h2>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-analytics.js"></script>
    
    <!-- Firebase Config -->
    <script src="firebase-config.js"></script>
    
    <!-- Auth Check Script -->
    <script>
        // Check authentication status and redirect accordingly
        auth.onAuthStateChanged((user) => {
            if (user) {
                // User is logged in, redirect to main/dashboard page
                // You can change this path to your main page
                window.location.href = 'User/UserLoginAndRegister.html#app-section';
            } else {
                // User is not logged in, redirect to login page
                window.location.href = 'User/UserLoginAndRegister.html';
            }
        });
    </script>
    <script src="theme.js"></script>
</body>
</html>
