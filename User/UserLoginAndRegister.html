<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Website</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="../image/favicon (1).ico"/>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="container">
        <!-- Auth Section -->
        <div id="auth-section">
            <h1 class = "Word">Desterriman's Website</h1>
            
            <div id="login-form" class="form-container">
                <h2>Login</h2>
                <form>
                    <div class="floating-input">
                        <input type="email" id="login-email" placeholder="" required>
                        <label for="login-email">Email</label>
                    </div>
                    <div class="floating-input" style="position: relative;">
                        <input type="password" id="login-password" placeholder=" " required minlength="6">
                        <label for="login-password">Password</label>
                        <button type="button" onclick="togglePasswordVisibility('login-password')" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); border: none; background: none; cursor: pointer;"><img id="login-password-icon" src="../image/eye.png" style="width: 20px; height: 20px;"></button>
                    </div>  
                    <button type="button" class="login-button" onclick="login()">Login</button>   
                    <p class="secondary">Don't have an account? <br> <a href="#" onclick="showRegister()" class="button-secondary">Register</a> <a href="#" onclick="showForgotPassword()" class="button-secondary">Forgot Password?</a></p>
                    <p class="login-google-button"> Login through? <button onclick="loginWithGoogle()"><img id ="google-login-icon" src="../image/google.png" style="width: 30px; height: 20px;"></button></p>
                    <p id="login-error" class="error"></p>
                </form>
            </div>
            
            <div id="register-form" class="form-container" style="display: none;">
                <h2>Register</h2>
                <form>
                    <div class="floating-input">
                        <input type="text" id="register-name" placeholder=" " required>
                        <label for="register-name">Full Name</label>
                    </div>
                    <div class="floating-input">
                        <input type="email" id="register-email" placeholder=" " required>
                        <label for="register-email">Email</label>
                    </div>
                    <div class="floating-input" style="position: relative;">
                        <input type="password" id="register-password" placeholder=" " required>
                        <label for="register-password">Password</label>
                        <button type="button" onclick="togglePasswordVisibility('register-password')" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); border: none; background: none; cursor: pointer; font-size: 18px;"><img id = "register-password" src = "../image/eye.png" style="width: 20px; height: 20px;"></button>
                    </div>
                    <button type="button" class="register-button" onclick="register()">Register</button>
                    <p class="secondary">Already have an account? <a href="#" onclick="showLogin()" class="button-secondary">Login</a></p>
                    <p id="register-error" class="error"></p>
                </form>
            </div>
         
            <div id="forgot-password-form" class = "form-container">
                <h2>Reset Password</h2>
                <form>
                    <div class="floating-input">
                        <input type="email" id="forgot-password-email" placeholder=" " required>
                        <label for="forgot-password-email">Email Address</label>
                    </div>
                    <button type="button" class="reset-button" onclick="resetPassword()">Send Reset Link</button>
                    <p>Remember your password? <a href="#" onclick="showLogin()" class="button-secondary">Back to Login</a></p>
                    <p id="forgot-password-error" class="error"></p>
                </form>
            </div>
        </div>

        <!-- App Section (Shown after login) -->
        <div id="app-section" style="display: none;">
            <div class="header">
                <h2>Welcome, <span id="user-name"></span></h2>
                <div class = "headerW-buttons">
                    <a href="../Doctor/DoctorList.html" class = "doctor-list-button" style="margin-left: 10px; padding: 8px 16px; color: white; text-decoration: none; border-radius: 5px;"><img id = "doctor-icon" src="../image/doctorlist.png"></a>
                    <a href="../calculator/calculatorIndex.html" class = "calculator-button" style="margin-left: 10px; padding: 8px 16px; color: white; text-decoration: none; border-radius: 5px;"><img id = "calculator-icon" src="../image/calculator.png"></a>
                    <!--<button onclick="logout()" class="logout-btn">Logout</button>-->
                    <a href="../ToDoList/ToDo.html" class = "todo-button" style="margin-left: 10px; padding: 8px 16px; color: white; text-decoration: none; border-radius: 5px;"><img id = "todo-icon" src="../image/to-do-list.png"></a>
                    <a href="../User/UserProfile.html" class = "user-profile-button" style="margin-left: 10px; padding: 8px 16px; color: white; text-decoration: none; border-radius: 4px;"><img id = "profile-icon" src="../image/user.png"></a>
                </div>
            </div>
            
            <div class="dashboard">
                <!-- Add Note Section -->
                <div class="add-note">
                    <h3>Add a Note</h3>
                    <textarea id="note-content" placeholder="Write your note here..."></textarea>
                    <button class="save-note-button" onclick="addNote()">Save Note</button>
                </div>
                
                <!-- Notes List -->
                <div class="notes-list">
                    <h3>Your Notes</h3>
                    <div id="notes-container">
                        <!-- Notes will be dynamically added here, show list of notes -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Files -->
    <script src="../firebase-config.js"></script>
    <script src="app.js"></script>
</body>
</html>
