<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Website</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="container">
        <!-- Auth Section -->
        <div id="auth-section">
            <h1>Welcome to MyPage</h1>
            
            <div id="login-form" class="form-container">
                <h2>Login</h2>
                <div class="floating-input">
                    <input type="email" id="login-email" placeholder=" " required>
                    <label for="login-email">Email</label>
                </div>
                <div class="floating-input" style="position: relative;">
                    <input type="password" id="login-password" placeholder=" " required>
                    <label for="login-password">Password</label>
                    <button type="button" onclick="togglePasswordVisibility('login-password')" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); border: none; background: none; cursor: pointer;"><img id="login-password-icon" src="images/eye-open.png" style="width: 20px; height: 20px;"></button>
                </div>  
                <button class="login-button" onclick="login()">Login</button>   
                <p class="secondary">Don't have an account? <br> <a href="#" onclick="showRegister()" class="button-secondary">Register</a>        <a href="#" onclick="showForgotPassword()" class="button-secondary">Forgot Password?</a></p>
                <p id="login-error" class="error"></p>
            </div>
            
            <div id="register-form" class="form-container" style="display: none;">
                <h2>Register</h2>
                <div class="floating-input">
                    <input type="text" id="register-name" placeholder=" " required>
                    <label for="register-name">Full Name</label>
                </div>
                <div class="floating-input">
                    <input type="email" id="register-email" placeholder=" " required>
                    <label for="register-email">Email</label>
                </div>
                <div class="floating-input" style="position: relative;">
                    <input type="password" id="register-password" placeholder=" " required>
                    <label for="register-password">Password</label>
                    <button type="button" onclick="togglePasswordVisibility('register-password')" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); border: none; background: none; cursor: pointer; font-size: 18px;"><img id = "register-password" src = "image/eye.png" style="width: 20px; height: 20px;"></button>
                </div>
                <button class="register-button" onclick="register()">Register</button>
                <p>Already have an account? <a href="#" onclick="showLogin()" class="button-secondary">Login</a></p>
                <p id="register-error" class="error"></p>
            </div>
         
            <div id="forgot-password-form" class = "form-container">
                <h2>Reset Password</h2>
                <div class="floating-input">
                    <input type="email" id="forgot-password-email" placeholder=" " required>
                    <label for="forgot-password-email">Email Address</label>
                </div>
                <button class="reset-button" onclick="resetPassword()">Send Reset Link</button>
                <p>Remember your password? <a href="#" onclick="showLogin()" class="button-secondary">Back to Login</a></p>
                <p id="forgot-password-error" class="error"></p>
            </div>
        </div>
        <!-- App Section (Shown after login) -->
        <div id="app-section" style="display: none;">
            <div class="header">
                <h2>Welcome, <span id="user-name"></span></h2>
                <button onclick="logout()" class="logout-btn">Logout</button>
            </div>
            
            <div class="dashboard">
                <!-- Add Note Section -->
                <div class="add-note">
                    <h3>Add a Note</h3>
                    <textarea id="note-content" placeholder="Write your note here..."></textarea>
                    <button onclick="addNote()">Save Note</button>
                </div>
                
                <!-- Notes List -->
                <div class="notes-list">
                    <h3>Your Notes</h3>
                    <div id="notes-container"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Files -->
    <script src="firebase-config.js"></script>
    <script src="app.js"></script>
</body>
</html>
