<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="todostyle.css">
    <link rel="icon" type="image/x-icon" href="../image/favicon (1).ico"/>
    <link rel="stylesheet" href="../theme.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="theme-toggle" aria-label="Theme toggle">
        <button id="themeToggle" class="theme-toggle-button" type="button" title="Toggle dark mode">🌙</button>
    </div>
    <div class="todo-container">
    <img class="back-button" src="../User/UserProfileImage/back-button.png" onclick="window.location.href= '../User/UserLoginAndRegister.html'; return false;" alt="Back Button" style="width: 40px; height: 40px; cursor: pointer; position: absolute; top: 20px; left: 20px;">
    <h1>To-Do List</h1>
        <div class="input-button-group">
            <input type ="text" id="todo-input" placeholder="Add a new task...">
            <button onclick="addTodo()">Add</button>
        </div>

        <br><br>
        <div class="todo-list" id ="todo-list">
            <!-- To-Do items will be displayed here -->
             <h2>Your Tasks</h2>
             <div class="todo-items">
                 <!-- Individual todo items will be injected here -->
                  
             </div>
        </div>

    </div>
    <!-- JavaScript Files -->
    <script src="../firebase-config.js"></script>
    <script src="todo.js"></script>
    <script src="../theme.js"></script>
</body>
</html>
