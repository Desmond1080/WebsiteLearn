        <title>Appointment Status</title>

        <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
        <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <body>

        <header class="doctor-header">
            <nav class="doctor-navbar">

                    <!-- Logo/Brand -->

                    </div>

                    <!-- Hamburger Menu for Mobile -->
                    <button class="hamburger" id="hamburger">
                        <span></span>
                        <span></span>
                        <span></span>
                    </button>

                    <!-- Navigation Links -->
                    <ul class="navbar-menu" id="navbar-menu">
                        <li class="nav-item">
                            <a href="../Doctor/DoctorDashboard.html" class="nav-link">
                                <i class="fas fa-home"></i> Dashboard
                            </a>
                        </li>

                        <li class="nav-item">
                            <a href="../Doctor/ManageAppointments.html" class="nav-link">
                                <i class="fas fa-calendar-check"></i> Appointments
                            </a>
                        </li>


                        <!-- User Profile Dropdown -->
                        <li class="nav-item dropdown">
                            <a href="#" class="nav-link dropdown-toggle" id="user-dropdown">
                                <i class="fas fa-user-circle"></i> 
                                <span id="doctor-name">Doctor</span>
                                <i class="fas fa-chevron-down"></i>
                            </a>
                            <ul class="dropdown-menu" id="dropdown-menu">
                                <li><a href="../Doctor/DoctorProfile.html" class="dropdown-link">
                                    <i class="fas fa-user"></i> My Profile
                                </a></li>
                                <li><a href="../Doctor/DoctorSettings.html" class="dropdown-link">

                                    <i class="fas fa-sign-out-alt"></i> Logout
                                </a></li>
                            </ul>
                        </li>
                    </ul>
                </div>
            </nav>
        </header>

        <main>
            <!-- a small navigate text back to the dashboard -->
            <p><a href="../Doctor/DoctorDashboard.html">Dashboard</a> > Appointment Status</p>
            <h1>Appointment Status</h1>
            <hr>
            <div class="appointment-overall-status-container" id="appointment-overall-status-container">
                <div class="appointment-overall-status-content" id="appointment-overall-status-content">
                </div>    
            </div>

            <!--logout confirmation pop-up-->
            <div class="logout-confirmation-popup" id="logout-confirmation-popup">
                <div class="logout-confirmation-content">
                    <h2>Confirm Logout</h2>
                    <p>Are you sure you want to logout?</p>
                    <i class="fas fa-sign-out-alt"></i>
                    <button onclick="confirmLogout()">Logout</button>
                    <button onclick="cancelLogout()" class="cancel-btn">Cancel</button>
                </div>
            </div>

        </main>

        <script defer src="../firebase-config.js"></script>
        <script defer src="../Doctor/ViewAppointmentStatus.js"></script>
        <scipt defer src="../Doctor/DoctorDashboard.js"></script>
        <script defer src="../theme.js"></script>
