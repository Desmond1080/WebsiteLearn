<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="calculatorStyle.css">
        <link rel="icon" type="image/x-icon" href="image/favicon (1).ico"/>
        <title>Calculator</title>
    </head>
    <body>
        <h1 class = "calculator-title">Calculator</h1> 
        <div>
            <a class="backHomeButton" href="../User/UserLoginAndRegister.html">Back to Home</a>
        </div>
        <div id = "calculator">
            <input type="text" id = "display" readonly>
            <br><br>
            <!-- display those calculator value-->
            <div class = "buttons-container">
                <button onclick = "scientificFunction('sin')">sin</button>
                <button onclick = "scientificFunction('cos')">cos</button>
                <button onclick = "scientificFunction('tan')">tan</button>
                <button onclick = "scientificFunction('sqrt')">√</button>
                <button onclick = "scientificFunction('log')">log10</button>
                <button onclick = "scientificFunction('ln')">ln</button>
                
                <hr class="button-divider">
                
                <button onclick = "appendToDisplay('7')">7</button>
                <button onclick = "appendToDisplay('8')">8</button>
                <button onclick = "appendToDisplay('9')">9</button>
                <button onclick = "appendToDisplay('/')">/</button>
                <button onclick = "appendToDisplay('4')">4</button>
                <button onclick = "appendToDisplay('5')">5</button>
                <button onclick = "appendToDisplay('6')">6</button>
                <button onclick = "appendToDisplay('*')">*</button>
                <button onclick = "appendToDisplay('1')">1</button>
                <button onclick = "appendToDisplay('2')">2</button>
                <button onclick = "appendToDisplay('3')">3</button>
                <button onclick = "appendToDisplay('-')">-</button>
                <button onclick = "appendToDisplay('0')">0</button>
                <button onclick = "appendToDisplay('.')">.</button>
                <button onclick = "calculateResult()">=</button>
                <button onclick = "appendToDisplay('+')">+</button>
                <button onclick = "clearsingleLastEntry()"><img id = "clear-icon" src="../image/clear.png"></button>
                <button onclick = "clearDisplay()">C</button>
            </div>
            <br><br>
        </div>
        <script src="calculator.js"></script>
    </body>
</html>
