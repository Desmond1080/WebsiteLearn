<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="x-icon" href="../image/favicon (1).ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../Doctor/DoctorDashboard.css">
    <link rel="stylesheet" href="../theme.css">
    <title>Doctor Dashboard</title> 
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="theme-toggle" aria-label="Theme toggle">
        <button id="themeToggle" class="theme-toggle-button" type="button" title="Toggle dark mode">🌙</button>
    </div>
    <!-- Navigation Bar -->
    <header class="doctor-header">
        <nav class="doctor-navbar">
            <div class="navbar-container">
                <!-- Logo/Brand -->
                <div class="navbar-brand">
                    <span class="brand-text">Doctor Dashboard</span>
                </div>

                <!-- Hamburger Menu for Mobile -->
                <button class="hamburger" id="hamburger">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>

                <!-- Navigation Links -->
                <ul class="navbar-menu" id="navbar-menu">
                    <li class="nav-item">
                        <a href="../Doctor/DoctorDashboard.html" class="nav-link">
                            <i class="fas fa-home"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="../Doctor/ManagePatients.html" class="nav-link">
                            <i class="fas fa-user-injured"></i> Manage Patients
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="../Doctor/Appointments.html" class="nav-link">
                            <i class="fas fa-calendar-check"></i> Appointments
                        </a>
                    </li>


                    <!-- User Profile Dropdown -->
                    <li class="nav-item dropdown">
                        <a href="#" class="nav-link dropdown-toggle" id="user-dropdown">
                            <i class="fas fa-user-circle"></i> 
                            <span id="doctor-name">Doctor</span>
                            <i class="fas fa-chevron-down"></i>
                        </a>
                        <ul class="dropdown-menu" id="dropdown-menu">
                            <li><a href="../Doctor/DoctorProfile.html" class="dropdown-link">
                                <i class="fas fa-user"></i> My Profile
                            </a></li>
                            <li><a href="../Doctor/DoctorSettings.html" class="dropdown-link">
                                <i class="fas fa-cog"></i> Settings
                            </a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a href="#" class="dropdown-link" id="doctor-logout-button">
                                <i class="fas fa-sign-out-alt"></i> Logout
                            </a></li>
                        </ul>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="doctor-main">
        <div class="dashboard-container">
            <!-- Dashboard content goes here -->
            <h1>Welcome to the Doctor Dashboard</h1>
            <p>Use the navigation bar to manage patients, appointments, and view reports.</p>
            
            <br>

            <h2>Total Users</h2>
        
            <!--logout confirmation pop-up-->
        <div class="logout-confirmation-popup" id="logout-confirmation-popup" style="display: none;">
            <div class="logout-confirmation-content">
                <h2>Confirm Logout</h2>
                <p>Are you sure you want to logout?</p>
                <p><img src="../Admin/adminImage/logout (1).png" alt="Logout Icon"></p>
                <button onclick="confirmLogout()">Logout</button>
                <button onclick="cancelLogout()" class="cancel-btn">Cancel</button>
            </div>
        </div>

        </div>
    </main>

    <!-- script-->
    <script src="../firebase-config.js"></script>
    <script src="../Doctor/DoctorDashboard.js"></script>
    <script src="../theme.js"></script>
</body>
</html>
